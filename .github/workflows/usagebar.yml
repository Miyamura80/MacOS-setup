name: UsageBar

on:
  pull_request:
    paths:
      - 'usagebar/**'
      - 'install_script.sh'
      - '.github/workflows/usagebar.yml'
  push:
    branches: [main]
    paths:
      - 'usagebar/**'
      - 'install_script.sh'
      - '.github/workflows/usagebar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usagebar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and regression checks
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Test, build, and verify relocated app
        run: ./usagebar/scripts/verify.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent usagebar/dist/UsageBar.app usagebar/dist/UsageBar.zip
      - name: Upload app and sample previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UsageBar
          path: |
            usagebar/dist/UsageBar.zip
            usagebar/.build/previews/*.png
          include-hidden-files: true
          if-no-files-found: error
